<!-- header start -->
<app-header-two [style_2]="true"></app-header-two>
<!-- header end -->

<main>
  <!-- breadcrumb area start -->
  <section class="breadcrumb__area include-bg text-center pt-95 pb-50">
    <div class="container">
      <div class="row">
        <div class="col-xxl-12">
          <div class="breadcrumb__content p-relative z-index-1">
            <h3 class="breadcrumb__title">My account</h3>
            <div class="breadcrumb__list">
              <span><a href="#">Home</a></span>
              <span>My account</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- breadcrumb area end -->

  <!-- register area start -->
  <section class="tp-login-area pb-140 p-relative z-index-1 fix">
    <div class="tp-login-shape">
      <img loading="lazy" class="tp-login-shape-1" src="/assets/img/login/login-shape-1.png" alt="">
      <img loading="lazy" class="tp-login-shape-2" src="/assets/img/login/login-shape-2.png" alt="">
      <img loading="lazy" class="tp-login-shape-3" src="/assets/img/login/login-shape-3.png" alt="">
      <img loading="lazy" class="tp-login-shape-4" src="/assets/img/login/login-shape-4.png" alt="">
    </div>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8">
          <div class="tp-login-wrapper">
            <div class="tp-login-top text-center mb-30">
              <h3 class="tp-login-title">Sign Up Genex.</h3>
              <p>Already have an account? <span><a routerLink="/pages/login">Sign In</a></span></p>
            </div>
            <div class="tp-login-option">
              <!-- register form start -->
              <app-register-form></app-register-form>
              <!-- register form end -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- register area end -->
</main>

<!-- footer start -->
<app-footer-one [primary_style]="true"></app-footer-one>
<!-- footer end -->

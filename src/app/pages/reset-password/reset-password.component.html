<!-- breadcrumb area start -->
<section class="breadcrumb__area include-bg text-center pt-95 pb-50">
  <div class="container">
    <div class="row">
      <div class="col-xxl-12">
        <div class="breadcrumb__content p-relative z-index-1">
          <h3 class="breadcrumb__title">Reset Password</h3>
          <div class="breadcrumb__list">
            <span><a href="#">Home</a></span>
            <span>Reset Password</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- breadcrumb area end -->

<!-- reset password area start -->
<section class="tp-login-area pb-140 p-relative z-index-1 fix">
  <div class="tp-login-shape">
    <img loading="lazy"
      class="tp-login-shape-1"
      src="/assets/img/login/login-shape-1.png"
      alt="shape"
    />
    <img loading="lazy"
      class="tp-login-shape-2"
      src="/assets/img/login/login-shape-2.png"
      alt="shape"
    />
    <img loading="lazy"
      class="tp-login-shape-3"
      src="/assets/img/login/login-shape-3.png"
      alt="shape"
    />
    <img loading="lazy"
      class="tp-login-shape-4"
      src="/assets/img/login/login-shape-4.png"
      alt="shape"
    />
  </div>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-6 col-lg-8">
        <div class="tp-login-wrapper">
          <div class="tp-login-top text-center mb-30">
            <h3 class="tp-login-title">Reset Your Password</h3>
            <p>Enter your new password below.</p>
          </div>
          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <div class="tp-login-option">
              <div class="tp-login-input-wrapper">
                <div class="tp-login-input-box">
                  <div class="tp-login-input">
                    <input
                      id="newPassword"
                      type="password"
                      placeholder="New Password"
                      formControlName="newPassword"
                      name="newPassword"
                    />
                  </div>
                  <div class="tp-login-input-title">
                    <label for="newPassword">New Password</label>
                  </div>
                  <span
                    *ngIf="
                      (newPassword?.hasError('required') && newPassword?.touched) ||
                      (formSubmitted && !newPassword?.value)
                    "
                    class="text-danger"
                  >
                    New password is required
                  </span>
                  <span
                    *ngIf="newPassword?.hasError('pattern') && newPassword?.touched"
                    class="text-danger"
                  >
                    Password must be at least 8 characters, include an uppercase letter, a number, and a special character
                  </span>
                </div>
                <div class="tp-login-input-box">
                  <div class="tp-login-input">
                    <input
                      id="confirmPassword"
                      type="password"
                      placeholder="Confirm Password"
                      formControlName="confirmPassword"
                      name="confirmPassword"
                    />
                  </div>
                  <div class="tp-login-input-title">
                    <label for="confirmPassword">Confirm Password</label>
                  </div>
                  <span
                    *ngIf="
                      (confirmPassword?.hasError('required') && confirmPassword?.touched) ||
                      (formSubmitted && !confirmPassword?.value)
                    "
                    class="text-danger"
                  >
                    Confirm password is required
                  </span>
                  <span
                    *ngIf="resetForm.hasError('mismatch') && confirmPassword?.touched"
                    class="text-danger"
                  >
                    Passwords do not match
                  </span>
                </div>
              </div>
              <div class="tp-login-bottom mb-15">
                <button type="submit" class="tp-login-btn w-100">
                  Reset Password
                </button>
              </div>
              <div
                class="tp-login-suggetions d-sm-flex align-items-center justify-content-center"
              >
                <div class="tp-login-forgot">
                  <span>Remember Password? <a routerLink="/pages/login"> Login</a></span>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- reset password area end -->

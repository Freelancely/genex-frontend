<!-- header start -->
<app-header-two [style_2]="true"></app-header-two>
<!-- header end -->

<main>
  <!-- Loading state -->
  <div *ngIf="loading" class="text-center">
    <p>Loading product details...</p>
  </div>

  <!-- Error state -->
  <div *ngIf="error && !loading" class="cartmini__empty text-center">
    <img loading="lazy" src="/assets/img/product/cartmini/empty-cart.png" alt="empty-cart-img" />
    <h4>Oops! Product not found</h4>
    <p>{{ error }}</p>
    <button class="tp-btn" (click)="goBackToShop()">Back to Shop</button>
  </div>

  <!-- Product details -->
  <div *ngIf="product && !loading">
    <!-- breadcrumb area start -->
    <app-shop-details-breadcrumb [product]="product"></app-shop-details-breadcrumb>
    <!-- breadcrumb area end -->

    <!-- shop details area start -->
    <section class="tp-product-details-area">
      <div class="tp-product-details-top pb-115">
        <div class="container">
          <div class="row">
            <div class="col-xl-7 col-lg-6">
              <!-- product details thumb start -->
              <app-product-details-thumb [product]="product"></app-product-details-thumb>
              <!-- product details thumb end -->
            </div>
            <div class="col-xl-5 col-lg-6">
              <!-- product details wrapper -->
              <app-product-details-wrapper [product]="product" />
              <!-- product details wrapper -->
            </div>
          </div>
        </div>
      </div>
      <div class="tp-product-details-bottom pb-140">
        <div class="container">
          <div class="row">
            <div class="col-xl-12">
              <!-- product details tab nav -->
              <app-product-details-tab-nav [product]="product"></app-product-details-tab-nav>
              <!-- product details tab nav -->
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- shop details area end -->

    <!-- related products start -->
    <app-related-products [productId]="product.id" />
    <!-- related products end -->
  </div>
</main>

<!-- footer start -->
<app-footer-one [primary_style]="true"></app-footer-one>
<!-- footer end -->

  <div class="tp-product-content-4">
    <h3 class="tp-product-title-4">
      <a [routerLink]="['/shop/shop-details', product.id]">{{product.title}}</a>
    </h3>
    <div class="tp-product-info-4">
      <p>{{product.category.name}}</p>
    </div>

    <div class="tp-product-price-inner-4">
      <div class="tp-product-price-wrapper-4">
        <ng-container *ngIf="product.discount > 0; else noDiscount">
          <span class="tp-product-price-4 new-price">
            {{ (product.price - (product.price * product.discount / 100)) | nprPrice }}
          </span>
          <span class="tp-product-price-4 old-price">{{ product.price | nprPrice }}</span>
        </ng-container>
        <ng-template #noDiscount>
          {{" "}}<span class="tp-product-price-4 new-price">{{ product.price | nprPrice }}</span>
        </ng-template>
      </div>
      <div class="tp-product-price-add-to-cart">
        <button *ngIf="!isItemInCart(product)" (click)="addToCart(product)" class="tp-product-add-to-cart-4">

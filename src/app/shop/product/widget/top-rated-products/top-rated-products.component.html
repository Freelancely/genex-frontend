<div class="tp-shop-widget-content">
  <div class="tp-shop-widget-product">
    <div *ngFor="let item of topRatedProducts" class="tp-shop-widget-product-item d-flex align-items-center">
      <div class="tp-shop-widget-product-thumb">
        <a [routerLink]="['/shop/shop-details', item.product.id]">
          <img loading="lazy" [src]="item.product.img" alt="product-img">
        </a>
      </div>
      <div class="tp-shop-widget-product-content">
        <div class="tp-shop-widget-product-rating-wrapper d-flex align-items-center">
          <div class="tp-shop-widget-product-rating">
            <span *ngFor="let i of [1, 2, 3, 4, 5]"
                  [ngClass]="{'fa-solid fa-star': i <= item.averageRating, 'fa-regular fa-star': i > item.averageRating}"></span>
          </div>
          <div class="tp-shop-widget-product-rating-number">
            <span>({{ item.averageRating }})</span>
          </div>
        </div>
        <h4 class="tp-shop-widget-product-title">
          <a [routerLink]="['/shop/shop-details', item.product.id]">{{ item.product.title }}</a>
        </h4>
        <div class="tp-shop-widget-product-price-wrapper">
          <span class="tp-shop-widget-product-price">{{ item.product.price | nprPrice }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
